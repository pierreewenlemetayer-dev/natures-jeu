<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#fff8ed"><title>Natures — Le Jeu</title><link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet"><style>
*{box-sizing:border-box}html,body{height:100%;margin:0;overflow:hidden}body{font-family:Fredoka,Arial,sans-serif;background:#fff8ed;color:#29334b}button{font:inherit;cursor:pointer;touch-action:manipulation}button:focus-visible,a:focus-visible{outline:3px solid #3975b7;outline-offset:2px}.app{height:100dvh;max-width:640px;margin:auto;display:flex;flex-direction:column;padding:clamp(8px,2vh,18px) 15px max(8px,env(safe-area-inset-bottom));gap:clamp(7px,1.5vh,14px)}header{text-align:center;flex:none}h1{font-size:clamp(36px,7vh,58px);line-height:1;margin:0;font-weight:700}h1 a{color:inherit;text-decoration:none;cursor:pointer}h2{font-size:clamp(19px,3vh,26px);margin:0;font-weight:500}.status{display:flex;justify-content:space-between;gap:10px;font-size:clamp(14px,2.5vh,19px);font-weight:600}.game{display:flex;flex-direction:column;flex:1;min-height:0;gap:clamp(8px,1.7vh,15px)}.panel{border:2px solid #e8d9bd;border-radius:22px;background:#fffdf8;padding:clamp(12px,2.6vh,24px);text-align:center}.prompt{display:flex;flex-direction:column;justify-content:center;min-height:clamp(92px,19vh,170px);gap:8px}.word{font-size:clamp(27px,6vh,46px);font-weight:700;overflow-wrap:anywhere}.question{font-size:clamp(17px,3vh,24px)}.choices{display:grid;grid-template-columns:1fr;gap:clamp(7px,1.4vh,12px)}.choices.yesno{grid-template-columns:1fr 1fr}.choice{min-height:clamp(48px,9vh,72px);border:2px solid #d8c6a6;background:#f5e9d5;border-radius:16px;color:#29334b;font-weight:600;font-size:clamp(17px,3vh,24px);padding:6px}.choice.correct{background:#d7f5df;border-color:#20824b;color:#17673a}.choice.wrong{background:#ffe0df;border-color:#bf3636;color:#a42424}.choice:disabled{cursor:default;opacity:1}.feedback{min-height:clamp(46px,9vh,80px);text-align:center;display:flex;flex-direction:column;justify-content:center;gap:4px;font-size:clamp(15px,2.6vh,20px)}.feedback .good{color:#17673a;background:#d7f5df;border-radius:8px;padding:2px 8px;align-self:center}.feedback .bad{color:#a42424;background:#ffe0df;border-radius:8px;padding:2px 8px;align-self:center}.accepted{color:#17673a;font-weight:600}.next{border:0;border-radius:16px;background:#405f99;color:white;min-height:clamp(44px,8vh,62px);font-size:clamp(17px,2.8vh,22px);font-weight:600;width:100%}.next:disabled{opacity:.45}.settings{display:flex;flex-direction:column;justify-content:center;gap:16px;flex:1}.modes{display:grid;grid-template-columns:1fr 1fr;gap:12px}.mode{border:2px solid #d8c6a6;border-radius:16px;padding:18px 8px;background:#f5e9d5;font-size:23px;font-weight:600}.mode.selected{background:#d9e6fc;border-color:#405f99;color:#284d90}footer{text-align:center;font-size:clamp(11px,1.8vh,14px);color:#7d715e;flex:none;margin-top:auto}@media(max-height:600px){.app{gap:5px}h1{font-size:32px}h2{font-size:17px}.panel{padding:9px}.prompt{min-height:75px}.word{font-size:28px}.choice{min-height:40px}.feedback{min-height:36px;font-size:14px}.next{min-height:40px}}[hidden]{display:none!important}
</style><script src="https://pierreewenlemetayer-dev.github.io/natures/js/data.js"></script></head><body><main class="app"><header><h1><a href="./" id="home" aria-label="Retour à l'accueil">Natures</a></h1><h2>Le Jeu</h2></header><div class="status"><span id="progress">10 questions</span><span id="score">Score : 0/10</span></div><section id="settings" class="settings"><div class="panel"><div class="question">Choisis ton mode de jeu</div></div><div class="modes"><button class="mode selected" data-mode="qcm">QCM</button><button class="mode" data-mode="yn">Oui / Non</button></div><button id="start" class="next">Jouer</button></section><section id="game" class="game" hidden><div class="panel prompt"><div id="word" class="word"></div><div id="question" class="question"></div></div><div id="choices" class="choices"></div><div id="feedback" class="feedback" role="status" aria-live="polite"></div><button id="next" class="next" hidden>Suivant</button></section><footer>© Pierre Lemétayer – 2026</footer></main><script>
(()=>{
'use strict';
const data=window.NATURES_DATA||[];
// Réponses pédagogiques propres au jeu : le corpus de Natures reste intact.
const GAME_ANSWERS={
'mais':['coordination'],'pour':['préposition'],'si':['subordination','adverbe'],
'avant':['préposition','adverbe'],'contre':['préposition','adverbe'],
'pendant':['préposition'],'or':['coordination'],'son':['déterminant:possessif'],
'bien':['adverbe'],'être':['verbe'],'que':['subordination'],'même':['adjectif','adverbe'],
'boum':['onomatopée'],'bravo':['interjection'],'double':['adjectif','nom'],
'hélas':['interjection'],'juste':['adjectif','adverbe'],'miaou':['onomatopée'],
'moins':['adverbe'],'plus':['adverbe'],'tard':['adverbe'],
'clair':['adjectif'],'donc':['coordination'],'droit':['adjectif'],
'enfin':['adverbe'],'faux':['adjectif'],'fort':['adjectif'],'vrai':['adjectif'],
'cher':['adjectif'],'comme':['subordination'],'en':['préposition'],'haut':['adjectif','adverbe'],
'la':['déterminant:article défini'],'le':['déterminant:article défini'],'les':['déterminant:article défini'],
'leur':['déterminant:possessif'],'leurs':['déterminant:possessif'],
'mien':['pronom:possessif'],'mienne':['pronom:possessif'],'miennes':['pronom:possessif'],'nôtres':['pronom:possessif'],
'où':['pronom:relatif'],'quand':['subordination'],'quelque':['déterminant:indéfini'],'qui':['pronom:relatif'],
'propre':['adjectif'],'toc':['onomatopée']
};
const names={nom:'Nom',adjectif:'Adjectif',verbe:'Verbe',adverbe:'Adverbe','préposition':'Préposition',coordination:'Conjonction de coordination',subordination:'Conjonction de subordination',interjection:'Interjection','onomatopée':'Onomatopée'};
const full=a=>a.includes(':')?(a.startsWith('pronom:')?'Pronom ':'Déterminant ')+a.split(':')[1]:(names[a]||a);
const main=a=>a.split(':')[0];
const category=a=>['coordination','subordination'].includes(a)?'conjonction':main(a);
const categories=['nom','adjectif','verbe','adverbe','préposition','conjonction','déterminant','pronom','interjection','onomatopée'];
const title=c=>c==='conjonction'?'Conjonction':c==='déterminant'?'Déterminant':c==='pronom'?'Pronom':names[c];
const $=id=>document.getElementById(id);
const shuffle=a=>{for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
let mode='qcm',deck=[],index=0,score=0,answered=false,started=false;
document.querySelectorAll('.mode').forEach(b=>b.onclick=()=>{mode=b.dataset.mode;document.querySelectorAll('.mode').forEach(x=>x.classList.toggle('selected',x===b))});
function prepare(){
const chosen=[],used=new Set(),counts={};
const pool=shuffle(data.map(([word,sourceAnswers])=>{const answers=GAME_ANSWERS[word.toLocaleLowerCase("fr")]||sourceAnswers;return {word,answers,allCats:[...new Set(sourceAnswers.map(category))],cats:[...new Set(answers.map(category))]}}));
const targets=shuffle(['nom','nom','adjectif','verbe','adverbe','préposition','déterminant','pronom','conjonction',shuffle(['interjection','onomatopée','adjectif','verbe','adverbe'])[0]]);
for(const target of targets){const item=pool.find(x=>!used.has(x.word)&&x.cats.includes(target));if(item){used.add(item.word);chosen.push(item)}}
for(const item of pool){if(chosen.length===10)break;if(!used.has(item.word)){chosen.push(item);used.add(item.word)}}
return shuffle(chosen).map(item=>{
const correct=shuffle([...item.cats])[0];
if(mode==='qcm'){const wrong=shuffle(categories.filter(c=>!item.allCats.includes(c))).slice(0,2);return {...item,options:shuffle([correct,...wrong]),correct}}
const proposition=Math.random()<.5?correct:shuffle(categories.filter(c=>!item.allCats.includes(c)))[0];
return {...item,proposition,truth:item.cats.includes(proposition)};
});
}
function status(){$('progress').textContent='Question '+Math.min(index+1,10)+'/10';$('score').textContent='Score : '+score+'/10'}
function render(){
answered=false;status();$('feedback').replaceChildren();$('next').hidden=true;
const item=deck[index];$('word').textContent=item.word;$('question').textContent=mode==='qcm'?'Quelle est la nature de ce mot ?':title(item.proposition)+' ?';
const choices=$('choices');choices.replaceChildren();choices.classList.toggle('yesno',mode==='yn');
const options=mode==='qcm'?item.options:['Oui','Non'];
options.forEach(value=>{const b=document.createElement('button');b.className='choice';b.textContent=mode==='qcm'?title(value):value;b.onclick=()=>answer(value);choices.append(b)});
}
function answer(value){
if(answered)return;answered=true;const item=deck[index];
const ok=mode==='qcm'?item.allCats.includes(value):((value==='Oui')===item.truth);
if(ok)score++;status();
const bs=[...$('choices').children];
bs.forEach((b,i)=>{
const v=mode==='qcm'?item.options[i]:['Oui','Non'][i];
if(mode==='qcm'){if(item.cats.includes(v))b.classList.add('correct');else if(v===value)b.classList.add('wrong')}
else{if((v==='Oui')===item.truth)b.classList.add('correct');else if(v===value)b.classList.add('wrong')}
b.disabled=true;
});
const fb=$('feedback');const result=document.createElement('span');result.className=ok?'good':'bad';result.textContent=ok?'Bonne réponse !':'Réponse incorrecte';fb.append(result);
const accepted=document.createElement('span');accepted.className='accepted';accepted.textContent='Réponse'+(item.answers.length>1?'s':'')+' : '+item.answers.map(full).join(' · ');fb.append(accepted);
$('next').hidden=false;$('next').textContent=index===9?'Voir le résultat':'Suivant';
}
function start(){deck=prepare();index=0;score=0;started=true;$('settings').hidden=true;$('game').hidden=false;render()}
$('start').onclick=start;
$('next').onclick=()=>{if(!started){start();return}if(index===9){started=false;$('choices').replaceChildren();$('word').textContent=score+' / 10';$('question').textContent='Partie terminée !';$('progress').textContent='Résultat';$('feedback').replaceChildren();$('next').textContent='Rejouer';return}index++;render()};
window.__homeActivityActive=()=>started;
$('home').onclick=e=>{if(started&&!confirm('Une partie est en cours. Revenir à l’accueil ?'))e.preventDefault()};
})();
</script><script id="leave-guard">(function(){const active=()=>{try{return typeof window.__homeActivityActive==='function'?!!window.__homeActivityActive():!!(typeof started!=='undefined'&&started)}catch(_){return false}};let titleNavigation=false;const title=document.querySelector('h1 a.home-title-link, h1 a#home');if(title)title.addEventListener('click',e=>{if(!e.defaultPrevented&&active()){titleNavigation=true;setTimeout(()=>titleNavigation=false,1000)}});window.addEventListener('beforeunload',e=>{if(!titleNavigation&&active()){e.preventDefault();e.returnValue=''}})})();</script></body></html>

</style></head><body><main class="app"><header><h1><a href="./" id="home" aria-label="Retour à l'accueil">Natures</a></h1><h2>Le Jeu</h2></header><div class="status"><span id="progress">10 questions</span><span id="score">Score : 0/10</span></div><section id="settings" class="settings"><div class="panel"><div class="question">Choisis ton mode de jeu</div></div><div class="modes"><button class="mode selected" data-mode="qcm">QCM</button><button class="mode" data-mode="yn">Oui / Non</button></div><button id="start" class="next">Jouer</button></section><section id="game" class="game" hidden><div class="panel prompt"><div id="word" class="word"></div><div id="question" class="question"></div></div><div id="choices" class="choices"></div><div id="feedback" class="feedback" role="status" aria-live="polite"></div><button id="next" class="next" hidden>Suivant</button></section><footer>© Pierre Lemétayer – 2026</footer></main><script>

terminant:interrogatif","déterminant:exclamatif"]],["quelle",["déterminant:interrogatif","déterminant:exclamatif"]],["quelqu'un",["pronom:indéfini"]],["quelque",["déterminant:indéfini","adverbe"]],["question",["nom"]],["qui",["pronom:relatif","pronom:interrogatif"]],["quoi",["pronom:interrogatif","pronom:relatif"]],["quoique",["subordination"]],["raison",["nom"]],["rapide",["adjectif"]],["regarder",["verbe"]],["rendre",["verbe"]],["responsable",["nom","adjectif"]],["rivière",["nom"]],["rouge",["nom","adjectif"]],["sans",["préposition"]],["sauf",["adjectif","préposition"]],["savoir",["verbe","nom"]],["selon",["préposition"]],["seul",["adjectif"]],["seulement",["adverbe"]],["si",["subordination","adverbe","nom"]],["soir",["nom"]],["soleil",["nom"]],["son",["déterminant:possessif","nom"]],["sourire",["nom","verbe"]],["sous",["préposition"]],["souvent",["adverbe"]],["sur",["préposition"]],["sûrement",["adverbe"]],["surprenant",["adjectif"]],["table",["nom"]],["tard",["adverbe","nom"]],["tel",["adjectif","déterminant:indéfini","pronom:indéfini"]],["tellement",["adverbe"]],["terrible",["adjectif"]],["tête",["nom"]],["toc",["onomatopée","nom"]],["ton",["déterminant:possessif"]],["toujours",["adverbe"]],["tout",["déterminant:indéfini","pronom:indéfini","adverbe","nom"]],["tranquille",["adjectif"]],["travail",["nom"]],["travailler",["verbe"]],["très",["adverbe"]],["triste",["adjectif"]],["trouver",["verbe"]],["tu",["pronom:personnel"]],["un",["déterminant:article indéfini"]],["une",["déterminant:article indéfini"]],["vers",["préposition","nom"]],["vide",["adjectif"]],["vite",["adverbe"]],["voir",["verbe"]],["voiture",["nom"]],["votre",["déterminant:possessif"]],["vous",["pronom:personnel"]],["vrai",["adjectif","adverbe","nom"]],["vraie",["adjectif"]],["vraiment",["adverbe"]],["y",["pronom:adverbial"]]];

(()=>{
'use strict';
const data=window.NATURES_DATA;
const names={nom:'Nom',adjectif:'Adjectif',verbe:'Verbe',adverbe:'Adverbe','préposition':'Préposition',coordination:'Conjonction de coordination',subordination:'Conjonction de subordination',interjection:'Interjection','onomatopée':'Onomatopée'};
const full=a=>a.includes(':')?(a.startsWith('pronom:')?'Pronom ':'Déterminant ')+a.split(':')[1]:(names[a]||a);
const main=a=>a.split(':')[0];
const category=a=>['coordination','subordination'].includes(a)?'conjonction':main(a);
const categories=['nom','adjectif','verbe','adverbe','préposition','conjonction','déterminant','pronom','interjection','onomatopée'];
const title=c=>c==='conjonction'?'Conjonction':c==='déterminant'?'Déterminant':c==='pronom'?'Pronom':names[c];
const $=id=>document.getElementById(id);
const shuffle=a=>{for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
let mode='qcm',deck=[],index=0,score=0,answered=false,started=false;
document.querySelectorAll('.mode').forEach(b=>b.onclick=()=>{mode=b.dataset.mode;document.querySelectorAll('.mode').forEach(x=>x.classList.toggle('selected',x===b))});
function prepare(){
const chosen=[],used=new Set(),counts={};
const pool=shuffle(data.map(([word,answers])=>({word,answers,cats:[...new Set(answers.map(category))]})));
const targets=shuffle(['nom','nom','adjectif','verbe','adverbe','préposition','déterminant','pronom','conjonction',shuffle(['interjection','onomatopée','adjectif','verbe','adverbe'])[0]]);
for(const target of targets){const item=pool.find(x=>!used.has(x.word)&&x.cats.includes(target));if(item){used.add(item.word);chosen.push(item)}}
for(const item of pool){if(chosen.length===10)break;if(!used.has(item.word)){chosen.push(item);used.add(item.word)}}
return shuffle(chosen).map(item=>{
const correct=shuffle([...item.cats])[0];
if(mode==='qcm'){const wrong=shuffle(categories.filter(c=>!item.cats.includes(c))).slice(0,2);return {...item,options:shuffle([correct,...wrong]),correct}}
const proposition=Math.random()<.5?correct:shuffle(categories.filter(c=>!item.cats.includes(c)))[0];
return {...item,proposition,truth:item.cats.includes(proposition)};
});
}
function status(){$('progress').textContent='Question '+Math.min(index+1,10)+'/10';$('score').textContent='Score : '+score+'/10'}
function render(){
answered=false;status();$('feedback').replaceChildren();$('next').hidden=true;
const item=deck[index];$('word').textContent=item.word;$('question').textContent=mode==='qcm'?'Quelle est la nature de ce mot ?':title(item.proposition)+' ?';
const choices=$('choices');choices.replaceChildren();choices.classList.toggle('yesno',mode==='yn');
const options=mode==='qcm'?item.options:['Oui','Non'];
options.forEach(value=>{const b=document.createElement('button');b.className='choice';b.textContent=mode==='qcm'?title(value):value;b.onclick=()=>answer(value);choices.append(b)});
}
function answer(value){
if(answered)return;answered=true;const item=deck[index];
const ok=mode==='qcm'?item.cats.includes(value):((value==='Oui')===item.truth);
if(ok)score++;status();
const bs=[...$('choices').children];
bs.forEach((b,i)=>{
const v=mode==='qcm'?item.options[i]:['Oui','Non'][i];
if(mode==='qcm'){if(item.cats.includes(v))b.classList.add('correct');else if(v===value)b.classList.add('wrong')}
else{if((v==='Oui')===item.truth)b.classList.add('correct');else if(v===value)b.classList.add('wrong')}
b.disabled=true;
});
const fb=$('feedback');const result=document.createElement('span');result.className=ok?'good':'bad';result.textContent=ok?'Bonne réponse !':'Réponse incorrecte';fb.append(result);
const accepted=document.createElement('span');accepted.className='accepted';accepted.textContent='Réponse'+(item.answers.length>1?'s':'')+' : '+item.answers.map(full).join(' · ');fb.append(accepted);
$('next').hidden=false;$('next').textContent=index===9?'Voir le résultat':'Suivant';
}
function start(){deck=prepare();index=0;score=0;started=true;$('settings').hidden=true;$('game').hidden=false;render()}
$('start').onclick=start;
$('next').onclick=()=>{if(index===9){started=false;$('choices').replaceChildren();$('word').textContent=score+' / 10';$('question').textContent='Partie terminée !';$('progress').textContent='Résultat';$('feedback').replaceChildren();$('next').textContent='Rejouer';$('next').onclick=()=>{ $('next').onclick=next;start() };return}next()};
function next(){index++;render()}
$('home').onclick=e=>{if(started&&!confirm('Une partie est en cours. Revenir à l’accueil ?'))e.preventDefault()};
})();
</script></body></html>
